<title>PDF Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Gujarati:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Hind+Vadodara:wght@400;600;700&display=swap">
<style>
/* Layout: fixed top band (name, tabs, tools) over a scrolling stage that holds an A4 sheet (595x842 = PDF points). */
:root{
  --bg:#f4f2ee; --panel:#ffffff; --fg:#1d2327; --muted:#5b666d; --line:#dcd8d1;
  --accent:#0f6b62; --accent-fg:#ffffff; --accent-soft:#dcefec; --stage:#d8d5ce;
  --danger:#b3261e; --ok:#1b7a43;
  --font-ui:'Inter','Noto Sans Gujarati','Noto Sans Devanagari',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17191b; --panel:#202427; --fg:#e8eaeb; --muted:#9aa5ab; --line:#353b40;
    --accent:#4fc3b5; --accent-fg:#06201d; --accent-soft:#1d3a37; --stage:#101214;
    --danger:#f2b8b5; --ok:#7ed6a0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17191b; --panel:#202427; --fg:#e8eaeb; --muted:#9aa5ab; --line:#353b40;
  --accent:#4fc3b5; --accent-fg:#06201d; --accent-soft:#1d3a37; --stage:#101214;
  --danger:#f2b8b5; --ok:#7ed6a0; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:auto}
.brand svg{width:22px;height:22px;color:var(--accent)}
.field{display:flex;align-items:center;gap:4px;min-width:0}
.field input{width:150px;max-width:100%;height:36px;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
.ext{color:var(--muted)}
.pageinfo{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:600 14px var(--font-ui);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.55;cursor:default}
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--line)}
.tab{flex:none;height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:600 14px var(--font-ui);cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-block:10px;border-top:1px solid var(--line)}
.panel[hidden],.toast[hidden],.tool[hidden]{display:none}
.grp{display:flex;align-items:center;gap:6px;flex:none;padding-right:8px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.grp>.lbl{font-size:12px;color:var(--muted);white-space:nowrap}
.tool,.panel select{min-width:36px;height:36px;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:600 14px var(--font-ui);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.panel select{font-weight:400;padding:0 6px}
.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool:disabled{opacity:.5;cursor:default}
.colorbtn{position:relative;width:36px;padding:0;overflow:hidden}
.colorbtn b{font-size:15px;line-height:1;margin-top:-4px}
.colorbtn i{position:absolute;left:8px;right:8px;bottom:6px;height:4px;border-radius:2px;background:currentColor}
.colorbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sw.wide{width:44px;border-radius:6px}
.ic{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.ic[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ink{position:absolute;left:0;top:0;width:595px;pointer-events:none;touch-action:none}
.ink.on{pointer-events:auto;cursor:crosshair}
.file{position:relative}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
button:focus-visible,select:focus-visible,input:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:120px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:12px;white-space:nowrap}
.stage{flex:1;min-height:0;overflow:auto;background:var(--stage);padding-block:16px;-webkit-overflow-scrolling:touch}
.zoomwrap{margin:0 auto;position:relative}
.sheet{width:595px;position:relative;transform-origin:0 0;box-shadow:0 2px 14px rgba(0,0,0,.28);background:#fff;--page-fg:#1d2327}
.guides{position:absolute;inset:0;pointer-events:none}
.guide{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(128,128,128,.8)}
.guide span{position:absolute;right:6px;top:3px;font:600 10px var(--font-ui);background:rgba(0,0,0,.55);color:#fff;padding:1px 6px;border-radius:8px}
.zoom{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:5}
.zoom .tool{height:32px;min-width:32px;border:0}
.zoom output{align-self:center;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:6;font-weight:600}
.toast[data-kind="err"]{background:var(--danger);color:#fff}
/* The page itself: always paper-like, independent of the app theme. */
.doc{box-sizing:border-box;width:595px;padding:56px 48px;color:var(--page-fg);font-family:'Inter','Noto Sans Gujarati','Noto Sans Devanagari',sans-serif;font-size:16px;line-height:1.6;outline:none;overflow-wrap:anywhere;caret-color:currentColor}
.doc h1{font-size:32px;line-height:1.25;margin:0 0 .35em}
.doc h2{font-size:23px;line-height:1.3;margin:.6em 0 .3em}
.doc p,.doc div{margin:0}
.doc ul,.doc ol{margin:.3em 0;padding-left:1.5em}
.doc img{max-width:100%;height:auto;display:block;margin:.4em 0}
.doc img{outline:3px solid transparent;outline-offset:2px;transition:outline-color .18s}
.doc img.sel{outline-color:#0f6b62}
.doc hr{border:0;border-top:1.5px solid currentColor;opacity:.4;margin:.8em 0}
.doc .pb{border-top:1px dashed rgba(128,128,128,.7);height:0}
.xhost{position:fixed;left:0;top:0;width:595px;height:842px;z-index:-1;overflow:hidden;pointer-events:none}
.xpage{position:relative;width:595px;height:842px;overflow:hidden;--page-fg:#1d2327}
.xpage .doc{position:absolute;left:0}
.xpage .pb{border:0}
.xpage img.sel{outline:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){.brand span{display:none}.brand{margin-right:0}.field input{width:110px}}
@media (min-width:900px){.panel{flex-wrap:wrap;overflow:visible}}
/* Motion: short, eased, and switched off for people who ask for less movement. */
@keyframes panelIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes bump{40%{transform:scale(1.25);color:var(--accent)}}
@keyframes fade{from{opacity:0}}
.tool,.btn,.tab,.sw,.ic,.panel select,.field input{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .12s ease}
.tool:not(:disabled):active,.btn:not(:disabled):active,.sw:active,.ic:active{transform:scale(.94)}
@media (hover:hover){
  .tool:not(:disabled):hover,.btn:not(:disabled):hover,.panel select:hover{border-color:var(--accent)}
  .sw:hover,.ic:hover{transform:scale(1.12)}
  .btn.primary:not(:disabled):hover{filter:brightness(1.1)}
}
.panel:not([hidden]){animation:panelIn .24s cubic-bezier(.2,.8,.2,1)}
.zoomwrap{animation:sheetIn .5s cubic-bezier(.2,.8,.2,1) backwards}
.zoom{animation:pop .3s ease-out .35s backwards}
.guide{animation:fade .35s ease-out}
.toast:not([hidden]){animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.toast[data-kind="busy"]::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;animation:spin .7s linear infinite}
.tool:not([hidden]).appear,#t-undo:not([hidden]),#s-undo:not([hidden]),#t-cancel:not([hidden]),#s-cancel:not([hidden]){animation:pop .2s ease-out}
.pageinfo{display:inline-block}
.pageinfo.bump{animation:bump .35s ease-out}
.btn.primary.busy{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
.tabind{position:absolute;left:0;bottom:0;height:2px;width:var(--w,0px);transform:translateX(var(--x,0px));background:var(--accent);pointer-events:none}
.tabs.js .tab[aria-selected="true"]{border-bottom-color:transparent}
.ready .tabind{transition:transform .3s cubic-bezier(.3,.7,.2,1),width .3s cubic-bezier(.3,.7,.2,1)}
.ready .sheet{transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.ready .zoomwrap{transition:width .3s cubic-bezier(.3,.7,.2,1),height .3s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){
  *,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
